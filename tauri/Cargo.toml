[package]
name = "origa-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "origa_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["release-devtools"]
release-devtools = ["tauri/devtools"]
# App Store builds: disables self-updater + single-instance + devtools for
# Mac App Store compliance (Guideline 2.4.5(vii) — no self-update mechanisms,
# 2.5.1 — no debug code). Use with `--no-default-features --features app-store`.
app-store = []
# Compile-time kill-switch for the device-ai plugin (native ASR/OCR/TTS).
# Build with `--features disable-device-ai` to drop the plugin entirely and
# force the fallback stack (Whisper/NDLOCR WASM + tauri-plugin-tts) on every
# platform — useful if native quality proves unacceptable for Japanese and a
# release is needed before code can be reverted.
disable-device-ai = []

[build-dependencies]
tauri-build.workspace = true
serde_json.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-tts.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sentry.workspace = true

# device-ai plugin + crate: native ASR/OCR/TTS, primary on macOS/iOS/Android.
# Excluded on Windows (upstream windows.rs does not compile against windows
# 0.58 and Windows TTS does not play audio — see root Cargo.toml note) and
# Linux (no device-ai backend). Windows + Linux keep their current stack.
# device-ai Rust crate gives macOS desktop direct access (file-based ASR).
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-device-ai-apis.workspace = true
device-ai.workspace = true

# base64 decode for the device-ai file-recognition command (audio payload).
[target.'cfg(target_os = "macos")'.dependencies]
base64.workspace = true

# Mobile-only plugins — desktop compilation excludes them via target cfg.
# Per Tauri plugin docs: haptics supports only Android/iOS (no desktop stubs
# in the public API). Target-scoping keeps the desktop binary clean.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics.workspace = true
