name: CI

on:
    pull_request:
        branches: [master]
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

permissions:
    contents: read
    actions: write

# Path-based job filtering
# ========================
# The `changes` job detects which components a PR touches (via
# dorny/paths-filter, SHA-pinned) and turns them into per-job `run_*`
# flags. Filtered jobs skip themselves with
# `if: needs.changes.outputs.run_<job> == 'true'`.
# Non-PR events (release tags, workflow_dispatch) force every run_* to
# true — the release pipeline is always a full run. Exception:
# run_macos_check carries the dependabot actor clause and can be false
# on non-PR events too.
#
# Invariants — violate these and CI silently rots:
# 1. CI Gate: a `skipped` result is legal ONLY when the job's run_* flag
#    is false (path-filter skip). A skip with run_*=true means an
#    upstream dependency failed/was cancelled and MUST fail the gate.
#    This is what keeps the single required check fail-closed under
#    auto-merge. Do NOT remove `if: always()` from the check job.
# 2. A filtered job's run_* condition must be a subset of the union of
#    its filtered needs' conditions — otherwise a skipped dependency
#    silently skips the job even when its own flag is true.
# 3. `changes` and `version` are never path-filtered: the gate asserts
#    them success-only (a failed detection run must turn the PR red,
#    not green).
# 4. e2e-report has no run flag of its own: it follows e2e's RESULT
#    (`!= 'skipped'`) and is asserted in the gate through run_e2e.
#
# Adding a job: add a run_* output to `changes`, wire the job's if, add
# the job to check.needs AND a gate() assertion line.

jobs:
    changes:
        name: Detect changes
        permissions:
            contents: read
            pull-requests: read
        runs-on: ubuntu-latest
        outputs:
            run_lint: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.landing == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.utils == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_macos_check: >-
              ${{ (github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.ci == 'true') &&
              github.actor != 'dependabot[bot]' }}
            run_cdn_download: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.e2e == 'true' ||
              steps.components.outputs.utils == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_test: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.utils == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_wasm_test: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_e2e_build: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.e2e == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_e2e_matrix_guard: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.e2e == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_e2e: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.e2e == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_build_tauri: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_build_macos: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_android_smoke: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.tauri == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_docker_landing: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.landing == 'true' ||
              steps.components.outputs.ci == 'true' }}
            run_docker_ui: >-
              ${{ github.event_name != 'pull_request' ||
              steps.components.outputs.core == 'true' ||
              steps.components.outputs.wasm == 'true' ||
              steps.components.outputs.ci == 'true' }}
        steps:
            # PR-only: on tags/dispatch the step is skipped, its outputs
            # stay empty, and the `github.event_name != 'pull_request'`
            # prefix in every run_* forces a full run.
            - name: Detect changed components
              id: components
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      core:
                          - origa/**
                          - Cargo.toml
                          - Cargo.lock
                          - build_defaults.rs
                          - .cargo/**
                          - .dockerignore
                          - .taurignore
                          - .rustfmt.toml
                          - clippy.toml
                      wasm:
                          - origa_ui/**
                      landing:
                          - origa_landing/**
                      tauri:
                          - tauri/**
                          - tauri-plugin-aswebauth/**
                      e2e:
                          - end2end/**
                      utils:
                          - utils/**
                      ci:
                          - .github/**

    version:
        name: Version
        permissions:
            contents: read
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            version_base: ${{ steps.version.outputs.version_base }}
            version_type: ${{ steps.version.outputs.version_type }}
            commit_sha: ${{ steps.version.outputs.commit_sha }}
            commit_short: ${{ steps.version.outputs.commit_short }}
            build_date: ${{ steps.version.outputs.build_date }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Calculate version
              id: version
              uses: ./.github/actions/version

    # Compile gate for macOS-only native code (tauri-plugin-aswebauth,
    # device-ai commands): the workspace clippy job runs on Linux and never
    # sees `cfg(target_os = "macos")` code, so without this check such code
    # would first compile on a release tag. Apple-silicon only — Intel Macs
    # are legacy. Public repo — macos runners are free; check/clippy (no
    # bundling) keeps the job in minutes.
    macos-check:
        name: Check (aarch64 macOS)
        permissions:
            contents: read
        needs: [changes]
        if: needs.changes.outputs.run_macos_check == 'true'
        runs-on: macos-15
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: aarch64-apple-darwin
                  shared-key: origa-macos-check-v1
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Check tauri app + aswebauth plugin
              run: |
                  cargo check --locked -p origa-app -p tauri-plugin-aswebauth \
                    --target aarch64-apple-darwin

            - name: Clippy tauri app + aswebauth plugin
              run: |
                  cargo clippy --locked -p origa-app -p tauri-plugin-aswebauth \
                    --target aarch64-apple-darwin --all-targets -- -D warnings

            - name: Test tauri-plugin-aswebauth (darwin)
              run: |
                  cargo test --locked -p tauri-plugin-aswebauth \
                    --target aarch64-apple-darwin

    lint:
        name: Lint
        permissions:
            contents: read
        needs: [changes]
        if: needs.changes.outputs.run_lint == 'true'
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            ORIGA_LANDING_BASE_URL: "https://${{ vars.ORIGA_BASE_URI }}"
            ORIGA_APP_BASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            TRAILBASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Setup Node.js for landing CSS
              uses: actions/setup-node@v7
              with:
                  node-version: "20"

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Check formatting
              run: cargo fmt --check --all

            - name: Run clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Verify App Store cfg compiles
              # The ORIGA_APP_STORE env var triggers build.rs to emit
              # cargo:rustc-cfg=app_store, gating out the auto-updater and
              # process-runner plugins plus their IPC commands (single-instance
              # STAYS — deep-link protocol activation needs it). Note:
              # devtools are NOT affected by this env var — disabling them
              # requires the app-store cargo feature, which tauri-cli does
              # not propagate; both store packaging paths (macOS, MSIX)
              # currently ship with devtools enabled (see ADR-042). Without
              # this check, regressions in the gated code path surface only
              # at tag-push on macos-15 (~30 min, blocks release).
              run: ORIGA_APP_STORE=1 cargo check -p origa-app

    cdn-download:
        name: Download CDN
        permissions:
            contents: read
        needs: [changes]
        if: needs.changes.outputs.run_cdn_download == 'true'
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download CDN data
              uses: ./.github/actions/download-cdn
              with:
                  cache-key: cdn-data-v14-${{ hashFiles('end2end/cdn-manifest.txt') }}
                  cdn-base-url: ${{ vars.ORIGA_CDN_BASE_URL }}

            - name: Upload CDN artifact
              uses: actions/upload-artifact@v7
              with:
                  name: cdn-data
                  path: cdn/
                  retention-days: 1

    test:
        name: Test
        permissions:
            contents: read
        needs: [changes, cdn-download]
        if: needs.changes.outputs.run_test == 'true'
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            ORIGA_LANDING_BASE_URL: "https://${{ vars.ORIGA_BASE_URI }}"
            ORIGA_APP_BASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            TRAILBASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Setup Node.js for landing CSS
              uses: actions/setup-node@v7
              with:
                  node-version: "20"

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Run tests
              run: cargo test --workspace --exclude origa_landing

    wasm-test:
        name: WASM Component Tests
        permissions:
            contents: read
        needs: [changes, cdn-download]
        if: needs.changes.outputs.run_wasm_test == 'true'
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0

            - name: Run WASM component tests
              run: wasm-pack test --headless --chrome origa_ui --features csr

    e2e-build:
        name: E2E Build
        permissions:
            contents: read
        needs: [changes, cdn-download]
        if: needs.changes.outputs.run_e2e_build == 'true'
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: http://localhost:8080
            TRAILBASE_URL: http://localhost:4000
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Setup Frontend
              uses: ./.github/actions/setup-frontend
              with:
                  tools: trunk

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Build WASM
              run: cd origa_ui && trunk build --release
              env:
                  ORIGA_CDN_BASE_URL: http://localhost:8080
                  TRAILBASE_URL: http://localhost:4000

            - name: Upload WASM artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-dist
                  path: origa_ui/dist/
                  retention-days: 1

    # Runs the Android app on an emulator — the only CI net for the class of
    # startup bugs that compile fine and build fine but crash on launch
    # (born from the tao 0.35 ndk-context break, ADR-044). Builds a debug
    # APK for the SAME ABI as the emulator (x86_64); production release
    # builds stay aarch64 via _build-tauri.yml. The WASM frontend is built
    # in-job (self-contained: no artifact cascades, no skip-legal traps).
    android-smoke:
        name: Android Smoke (emulator)
        permissions:
            contents: read
        needs: [changes, cdn-download]
        if: needs.changes.outputs.run_android_smoke == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            ORIGA_CDN_BASE_URL: ${{ vars.ORIGA_CDN_BASE_URL }}
            # NDK r26 exact version — single source of truth, same as
            # _build-tauri.yml build-android.
            NDK_VERSION: '26.1.10909125'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Android target: only protobuf-compiler is required from the
            # system (the heavy webkit/speechd set is for desktop targets;
            # see lint/e2e-build if an android build ever needs more).
            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages: protobuf-compiler
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown,x86_64-linux-android
                  shared-key: origa-android-smoke-v1
                  save-if: false

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - name: Setup Android SDK + NDK + emulator
              uses: android-actions/setup-android@v4
              with:
                  packages: 'tools platform-tools ndk;${{ env.NDK_VERSION }} emulator system-images;android-34;google_apis;x86_64'

            - name: Configure NDK environment
              # setup-android@v4 exports ANDROID_SDK_ROOT/ANDROID_HOME but NOT
              # NDK_HOME/ANDROID_NDK_ROOT (see _build-tauri.yml for the full
              # rationale).
              run: |
                  NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
                  if [ ! -d "$NDK_PATH" ]; then
                      echo "::error::NDK directory not found at: $NDK_PATH"
                      ls -1 "${ANDROID_SDK_ROOT}/ndk/" 2>/dev/null || true
                      exit 1
                  fi
                  echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
                  echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

            - name: Cache Gradle
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*',
                      '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Setup frontend tools
              uses: ./.github/actions/setup-frontend

            - name: Add cargo bin to PATH
              run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            # Fail fast (minutes, not half an hour): the android-cfg code the
            # host clippy never sees is checked here before the APK build.
            # cc-rs (ring) needs the NDK toolchain explicitly — the tauri CLI
            # injects CC/AR only for its own `cargo tauri android build`.
            - name: Check Android target compiles
              run: |
                  TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
                  export CC_x86_64_linux_android="$TOOLCHAIN/x86_64-linux-android24-clang"
                  export AR_x86_64_linux_android="$TOOLCHAIN/llvm-ar"
                  cargo check -p origa-app --lib --target x86_64-linux-android

            - name: Install Tauri CLI (npm)
              working-directory: tauri
              run: npm install

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            # --release on purpose: the debug WASM bundle (~300 MB) OOM-kills
            # the Android WebView heap (tauri-apps/tauri#13554) and would
            # turn this job false-red on fixed code. Same profile as
            # e2e-build / production artifact.
            - name: Build WASM frontend
              run: cd origa_ui && trunk build --release

            - name: Build debug APK (x86_64)
              working-directory: tauri
              # Explicit --apk: pin the output flavor instead of relying on
              # the CLI default (which may build apk+aab — double the time).
              run: cargo tauri android build --debug --target x86_64-linux-android --apk

            - name: Verify KVM availability
              run: |
                  if [ ! -e /dev/kvm ]; then
                      echo "::error::/dev/kvm not available on this runner"
                      exit 1
                  fi

            - name: Start emulator
              run: |
                  echo "no" | avdmanager create avd -n smoke \
                      -k "system-images;android-34;google_apis;x86_64" -d pixel --force
                  nohup emulator -avd smoke -no-window -no-audio -no-boot-anim \
                      -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
                  echo "emulator launching (log: /tmp/emulator.log)"

            - name: Run smoke test
              run: |
                  apk="$(find tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)"
                  tauri/scripts/android_smoke.sh "$apk"

    # Fails fast when a BDD scenario is silently excluded from the matrix
    # (dead) or runs in several groups (duplicated). Born from a real hole:
    # the old `Фразы$` grep anchor excluded the whole phrases.feature while
    # CI stayed green. Patterns below are anchored by generated spec FILE
    # NAMES (`features/<name>.feature.spec.js` in the Playwright title path),
    # which is collision-proof — unlike feature-title substrings
    # ("Фразы" also matches "Фразы после онбординга").
    # Enforced by end2end/scripts/check-ci-matrix.mjs; keep the scenario
    # inventory and the matrix in sync through it, not by hand.
    e2e-matrix-guard:
        name: E2E Matrix Guard
        permissions:
            contents: read
        needs: [changes]
        if: needs.changes.outputs.run_e2e_matrix_guard == 'true'
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "20"

            - name: Install Node.js dependencies
              working-directory: end2end
              run: npm ci

            - name: Verify every BDD scenario runs in CI exactly once
              working-directory: end2end
              run: node scripts/check-ci-matrix.mjs

    e2e:
        name: E2E ${{ matrix.group }}
        permissions:
            contents: read
        needs: [changes, e2e-build, e2e-matrix-guard]
        if: needs.changes.outputs.run_e2e == 'true'
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                group:
                    - core
                    - words
                    - grammar-kanji
                    - profile-sync
                    - onboarding-lesson
                    - stress
        env:
            ORIGA_CDN_BASE_URL: http://localhost:8080
            TRAILBASE_URL: http://localhost:4000
            ORIGA_ADMIN_EMAIL: admin@localhost
            ORIGA_ADMIN_PASSWORD: secret
            CI: "true"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download WASM artifact
              uses: actions/download-artifact@v8
              with:
                  name: wasm-dist
                  path: origa_ui/dist/

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Cache TrailBase CLI
              id: cache-trailbase
              uses: actions/cache@v6
              with:
                  path: ~/.local/bin/trail
                  key: trailbase-v0.28.3-verified

            - name: Add TrailBase to PATH
              run: echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Validate TrailBase CLI
              id: validate-trailbase
              run: |
                  if command -v trail &> /dev/null && trail --version &> /dev/null; then
                    echo "valid=true" >> $GITHUB_OUTPUT
                  else
                    echo "valid=false" >> $GITHUB_OUTPUT
                  fi

            - name: Install TrailBase CLI
              if: steps.cache-trailbase.outputs.cache-hit != 'true' || steps.validate-trailbase.outputs.valid != 'true'
              run: |
                  for i in 1 2 3 4 5; do
                    tmp=$(mktemp) && curl -sSfL --retry 3 --retry-delay 10 -o "$tmp" \
                      https://trailbase.io/install.sh && bash "$tmp" && break
                    echo "Attempt $i failed, retrying in 15s..."
                    rm -f "$tmp"
                    sleep 15
                  done

            - name: Verify TrailBase
              run: trail --version

            - name: Install Node.js dependencies
              working-directory: end2end
              run: npm ci

            - name: TypeScript type check
              working-directory: end2end
              run: npm run typecheck

            - name: Generate BDD tests from .feature files
              working-directory: end2end
              run: npx bddgen

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-v1-${{ hashFiles('end2end/package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              working-directory: end2end

            - name: Run BDD tests (${{ matrix.group }})
              working-directory: end2end
              run: |
                  case "${{ matrix.group }}" in
                    core)
                      npx playwright test --project=bdd --retries=1 \
                        --grep "features/(smoke|session|navigation|home|failure_paths|i18n_en|loading_rkyv)\.feature\.spec\.js"
                      ;;
                    words)
                      npx playwright test --project=bdd --retries=1 \
                        --grep "features/(words|sets|phrases)\.feature\.spec\.js"
                      ;;
                    grammar-kanji)
                      npx playwright test --project=bdd --retries=1 \
                        --grep "features/(grammar|kanji)\.feature\.spec\.js"
                      ;;
                    profile-sync)
                      npx playwright test --project=bdd --retries=1 \
                        --grep "features/(profile|sync|auth)\.feature\.spec\.js"
                      ;;
                    onboarding-lesson)
                      npx playwright test --project=bdd --retries=1 \
                        --grep "features/(onboarding|onboarding_scoring|lesson|lesson_empty_state|phrases_onboarding)\.feature\.spec\.js"
                      ;;
                    stress)
                      # Full-corpus N1 scenarios: each seeds ~11k cards
                      # through the real onboarding import, so the group
                      # runs serially (--workers=1) to avoid two concurrent
                      # heavy WASM imports fighting for the 2-core runner.
                      npx playwright test --project=bdd --retries=1 --workers=1 \
                        --grep "features/n1_stress\.feature\.spec\.js"
                      ;;
                  esac

            - name: Upload blob report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: blob-report-${{ matrix.group }}
                  path: end2end/blob-report/
                  retention-days: 7

    e2e-report:
        name: E2E Report
        permissions:
            contents: read
        needs: [e2e]
        # Follows e2e's RESULT (no run flag of its own): merges reports
        # whenever e2e actually ran (success or failure); skipped along
        # with a path-skipped e2e. Asserted in the gate via run_e2e.
        if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Node.js dependencies
              working-directory: end2end
              run: npm ci

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-v1-${{ hashFiles('end2end/package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              working-directory: end2end

            - name: Download all blob reports
              uses: actions/download-artifact@v8
              with:
                  pattern: blob-report-*
                  path: end2end/all-blob-reports/

            - name: Flatten blob reports
              working-directory: end2end/all-blob-reports
              run: |
                  count=$(find . -mindepth 2 -type f | wc -l)
                  if [ "$count" -eq 0 ]; then
                    echo "No blob reports found - skipping merge"
                    exit 0
                  fi
                  find . -mindepth 2 -type f | while read -r f; do
                      dir_name=$(basename "$(dirname "$f")")
                      mv "$f" "./${dir_name}_$(basename "$f")"
                  done

            - name: Merge blob reports
              working-directory: end2end
              run: npx playwright merge-reports --reporter=html ./all-blob-reports

            - name: Upload merged Playwright report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-merged
                  path: end2end/playwright-report/
                  retention-days: 30

    build-tauri:
        name: Build Tauri
        needs: [changes, version, e2e-build]
        if: needs.changes.outputs.run_build_tauri == 'true'
        uses: ./.github/workflows/_build-tauri.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_base: ${{ needs.version.outputs.version_base }}
            version_type: ${{ needs.version.outputs.version_type }}
            commit_sha: ${{ needs.version.outputs.commit_sha }}
            build_date: ${{ needs.version.outputs.build_date }}
            wasm_artifact_name: wasm-dist
            platforms: "windows,linux,android"
            skip_android: ${{ github.actor == 'dependabot[bot]' }}
        secrets:
            tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || vars.TAURI_CI_DUMMY_PRIVATE_KEY }}
            tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
            android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
            android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

    build-macos:
        name: Build Tauri (macOS)
        # macOS build in regular CI, mirroring build-tauri (windows/linux/
        # android): the universal .app/.pkg bundle path — Xcode selection,
        # cert import, tauri build, productbuild — is exercised on every
        # push, so workflow-level breakage (like the import-codesign-certs
        # post-step exit 50) surfaces in CI instead of on a release tag.
        # iOS is skipped (skip_ios) — it stays a release-time target to
        # bound macOS runner minutes; App Store upload is gated by
        # version_type inside the reusable workflow.
        needs: [changes, version, e2e-build]
        if: needs.changes.outputs.run_build_macos == 'true'
        uses: ./.github/workflows/_build-tauri-apple.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_base: ${{ needs.version.outputs.version_base }}
            version_type: ${{ needs.version.outputs.version_type }}
            commit_sha: ${{ needs.version.outputs.commit_sha }}
            build_date: ${{ needs.version.outputs.build_date }}
            wasm_artifact_name: wasm-dist
            skip_ios: true
        secrets:
            apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
            apple-api-key: ${{ secrets.APPLE_API_KEY }}
            apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}
            apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
            apple-mac-app-cert-p12: ${{ secrets.APPLE_MAC_APP_CERT_P12 }}
            apple-mac-installer-cert-p12: ${{ secrets.APPLE_MAC_INSTALLER_CERT_P12 }}
            apple-mac-cert-password: ${{ secrets.APPLE_MAC_CERT_PASSWORD }}

    docker-build-landing:
        name: Docker Build (landing)
        permissions:
            contents: read
        needs: [changes]
        if: needs.changes.outputs.run_docker_landing == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build landing image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./origa_landing/Dockerfile
                  push: false
                  cache-from: type=registry,ref=ghcr.io/yurvon-screamo/origa:landing-buildcache
                  build-args: |
                      ORIGA_LANDING_BASE_URL=https://${{ vars.ORIGA_BASE_URI }}
                      ORIGA_APP_BASE_URL=https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}

    docker-build-ui:
        name: Docker Build (ui)
        permissions:
            contents: read
        needs: [changes]
        if: needs.changes.outputs.run_docker_ui == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build UI image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./origa_ui/Dockerfile
                  push: false
                  cache-from: type=registry,ref=ghcr.io/yurvon-screamo/origa:ui-buildcache
                  build-args: |
                      ORIGA_CDN_BASE_URL=https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}
                      ORIGA_CDN_REGION=${{ vars.ORIGA_CDN_REGION }}
                      TRAILBASE_URL=https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}

    check:
        name: CI Gate
        permissions:
            contents: read
        # Single required check. `if: always()` is load-bearing: without
        # it a skipped dependency (path-filtered PR) would skip the gate
        # itself and the PR could never go green. Do not remove.
        needs:
            [
                version,
                changes,
                lint,
                macos-check,
                cdn-download,
                test,
                wasm-test,
                e2e-build,
                e2e-matrix-guard,
                e2e,
                e2e-report,
                android-smoke,
                build-tauri,
                build-macos,
                docker-build-landing,
                docker-build-ui,
            ]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Verify all jobs passed
              run: |
                  # Fail-closed gate. For every filtered job a `skipped`
                  # result is legal ONLY when its run_* flag is false
                  # (path-filter skip). A skip with run_*=true means an
                  # upstream dependency failed or was cancelled — that
                  # must fail the gate. `changes` and `version` are
                  # never path-filtered, so for them skipped/failure are
                  # always red. e2e-report follows e2e's result and is
                  # asserted through run_e2e.
                  gate() {
                    local job="$1" result="$2" run="$3"
                    if [[ "$result" == "success" ]]; then
                      return 0
                    fi
                    if [[ "$result" == "skipped" && "$run" == "false" ]]; then
                      return 0
                    fi
                    echo "::error::$job failed with result: $result (run flag: $run)"
                    return 1
                  }

                  gate "version" "${{ needs.version.result }}" "true"
                  gate "changes" "${{ needs.changes.result }}" "true"
                  gate "lint" "${{ needs.lint.result }}" "${{ needs.changes.outputs.run_lint }}"
                  gate "macos-check" "${{ needs.macos-check.result }}" "${{ needs.changes.outputs.run_macos_check }}"
                  gate "cdn-download" "${{ needs.cdn-download.result }}" "${{ needs.changes.outputs.run_cdn_download }}"
                  gate "test" "${{ needs.test.result }}" "${{ needs.changes.outputs.run_test }}"
                  gate "wasm-test" "${{ needs.wasm-test.result }}" "${{ needs.changes.outputs.run_wasm_test }}"
                  gate "e2e-build" "${{ needs.e2e-build.result }}" "${{ needs.changes.outputs.run_e2e_build }}"
                  gate "e2e-matrix-guard" "${{ needs.e2e-matrix-guard.result }}" "${{ needs.changes.outputs.run_e2e_matrix_guard }}"
                  gate "e2e" "${{ needs.e2e.result }}" "${{ needs.changes.outputs.run_e2e }}"
                  gate "e2e-report" "${{ needs.e2e-report.result }}" "${{ needs.changes.outputs.run_e2e }}"
                  gate "android-smoke" "${{ needs.android-smoke.result }}" "${{ needs.changes.outputs.run_android_smoke }}"
                  gate "build-tauri" "${{ needs.build-tauri.result }}" "${{ needs.changes.outputs.run_build_tauri }}"
                  gate "build-macos" "${{ needs.build-macos.result }}" "${{ needs.changes.outputs.run_build_macos }}"
                  gate "docker-build-landing" "${{ needs.docker-build-landing.result }}" "${{ needs.changes.outputs.run_docker_landing }}"
                  gate "docker-build-ui" "${{ needs.docker-build-ui.result }}" "${{ needs.changes.outputs.run_docker_ui }}"

            - run: echo "All checks passed"
