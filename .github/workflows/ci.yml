name: CI

on:
    pull_request:
        branches: [master]
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

permissions:
    contents: read
    actions: write

jobs:
    version:
        name: Version
        permissions:
            contents: read
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            version_base: ${{ steps.version.outputs.version_base }}
            version_type: ${{ steps.version.outputs.version_type }}
            commit_sha: ${{ steps.version.outputs.commit_sha }}
            commit_short: ${{ steps.version.outputs.commit_short }}
            build_date: ${{ steps.version.outputs.build_date }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Calculate version
              id: version
              uses: ./.github/actions/version

    # Compile gate for macOS-only native code (tauri-plugin-aswebauth,
    # device-ai commands): the workspace clippy job runs on Linux and never
    # sees `cfg(target_os = "macos")` code, so without this check such code
    # would first compile on a release tag. Apple-silicon only — Intel Macs
    # are legacy. Public repo — macos runners are free; check/clippy (no
    # bundling) keeps the job in minutes.
    macos-check:
        name: Check (aarch64 macOS)
        permissions:
            contents: read
        runs-on: macos-15
        if: github.actor != 'dependabot[bot]'
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: aarch64-apple-darwin
                  shared-key: origa-macos-check-v1
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Check tauri app + aswebauth plugin
              run: |
                  cargo check --locked -p origa-app -p tauri-plugin-aswebauth \
                    --target aarch64-apple-darwin

            - name: Clippy tauri app + aswebauth plugin
              run: |
                  cargo clippy --locked -p origa-app -p tauri-plugin-aswebauth \
                    --target aarch64-apple-darwin --all-targets -- -D warnings

            - name: Test tauri-plugin-aswebauth (darwin)
              run: |
                  cargo test --locked -p tauri-plugin-aswebauth \
                    --target aarch64-apple-darwin

    lint:
        name: Lint
        permissions:
            contents: read
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            ORIGA_LANDING_BASE_URL: "https://${{ vars.ORIGA_BASE_URI }}"
            ORIGA_APP_BASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            TRAILBASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.1
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Setup Node.js for landing CSS
              uses: actions/setup-node@v7
              with:
                  node-version: "20"

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Check formatting
              run: cargo fmt --check --all

            - name: Run clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Verify App Store cfg compiles
              # The ORIGA_APP_STORE env var triggers build.rs to emit
              # cargo:rustc-cfg=app_store, gating out the auto-updater and
              # process-runner plugins plus their IPC commands (single-instance
              # STAYS — deep-link protocol activation needs it). Note:
              # devtools are NOT affected by this env var — disabling them
              # requires the app-store cargo feature, which tauri-cli does
              # not propagate; both store packaging paths (macOS, MSIX)
              # currently ship with devtools enabled (see ADR-042). Without
              # this check, regressions in the gated code path surface only
              # at tag-push on macos-15 (~30 min, blocks release).
              run: ORIGA_APP_STORE=1 cargo check -p origa-app

    cdn-download:
        name: Download CDN
        permissions:
            contents: read
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download CDN data
              uses: ./.github/actions/download-cdn
              with:
                  cache-key: cdn-data-v13-${{ hashFiles('end2end/cdn-manifest.txt') }}
                  cdn-base-url: ${{ vars.ORIGA_CDN_BASE_URL }}

            - name: Upload CDN artifact
              uses: actions/upload-artifact@v7
              with:
                  name: cdn-data
                  path: cdn/
                  retention-days: 1

    test:
        name: Test
        permissions:
            contents: read
        needs: cdn-download
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            ORIGA_LANDING_BASE_URL: "https://${{ vars.ORIGA_BASE_URI }}"
            ORIGA_APP_BASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            TRAILBASE_URL: "https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.1
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Cache UniDic dictionary
              uses: actions/cache@v6
              with:
                  path: origa_ui/public/dictionaries/unidic
                  key: unidic-dict-v1-${{ hashFiles('origa_ui/build.rs') }}
                  restore-keys: unidic-dict-v1-

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Setup Node.js for landing CSS
              uses: actions/setup-node@v7
              with:
                  node-version: "20"

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Run tests
              run: cargo test --workspace --exclude origa_landing

    wasm-test:
        name: WASM Component Tests
        permissions:
            contents: read
        needs: cdn-download
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.1
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Cache UniDic dictionary
              uses: actions/cache@v6
              with:
                  path: origa_ui/public/dictionaries/unidic
                  key: unidic-dict-v1-${{ hashFiles('origa_ui/build.rs') }}
                  restore-keys: unidic-dict-v1-

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0

            - name: Run WASM component tests
              run: wasm-pack test --headless --chrome origa_ui --features csr

    e2e-build:
        name: E2E Build
        permissions:
            contents: read
        needs: cdn-download
        runs-on: ubuntu-24.04
        env:
            ORIGA_CDN_BASE_URL: http://localhost:8080
            TRAILBASE_URL: http://localhost:4000
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.1
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2
                  save-if: false

            - name: Setup Frontend
              uses: ./.github/actions/setup-frontend
              with:
                  tools: trunk

            - name: Build landing CSS
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Build WASM
              run: cd origa_ui && trunk build --release
              env:
                  ORIGA_CDN_BASE_URL: http://localhost:8080
                  TRAILBASE_URL: http://localhost:4000

            - name: Upload WASM artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-dist
                  path: origa_ui/dist/
                  retention-days: 1

    e2e:
        name: E2E ${{ matrix.group }}
        permissions:
            contents: read
        needs: e2e-build
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                group:
                    - core
                    - words
                    - grammar-kanji
                    - profile-sync
                    - onboarding-lesson
        env:
            ORIGA_CDN_BASE_URL: http://localhost:8080
            TRAILBASE_URL: http://localhost:4000
            ORIGA_ADMIN_EMAIL: admin@localhost
            ORIGA_ADMIN_PASSWORD: secret
            CI: "true"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download WASM artifact
              uses: actions/download-artifact@v8
              with:
                  name: wasm-dist
                  path: origa_ui/dist/

            - name: Download CDN artifact
              uses: actions/download-artifact@v8
              with:
                  name: cdn-data
                  path: cdn/

            - name: Cache TrailBase CLI
              id: cache-trailbase
              uses: actions/cache@v6
              with:
                  path: ~/.local/bin/trail
                  key: trailbase-v0.28.3-verified

            - name: Add TrailBase to PATH
              run: echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Validate TrailBase CLI
              id: validate-trailbase
              run: |
                  if command -v trail &> /dev/null && trail --version &> /dev/null; then
                    echo "valid=true" >> $GITHUB_OUTPUT
                  else
                    echo "valid=false" >> $GITHUB_OUTPUT
                  fi

            - name: Install TrailBase CLI
              if: steps.cache-trailbase.outputs.cache-hit != 'true' || steps.validate-trailbase.outputs.valid != 'true'
              run: |
                  for i in 1 2 3 4 5; do
                    tmp=$(mktemp) && curl -sSfL --retry 3 --retry-delay 10 -o "$tmp" \
                      https://trailbase.io/install.sh && bash "$tmp" && break
                    echo "Attempt $i failed, retrying in 15s..."
                    rm -f "$tmp"
                    sleep 15
                  done

            - name: Verify TrailBase
              run: trail --version

            - name: Install Node.js dependencies
              working-directory: end2end
              run: npm ci

            - name: TypeScript type check
              working-directory: end2end
              run: npm run typecheck

            - name: Generate BDD tests from .feature files
              working-directory: end2end
              run: npx bddgen

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-v1-${{ hashFiles('end2end/package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              working-directory: end2end

            - name: Run BDD tests (${{ matrix.group }})
              working-directory: end2end
              run: |
                  case "${{ matrix.group }}" in
                    core)
                      npx playwright test --project=bdd --retries=0 \
                        --grep "Дымовой тест|Сохранение сессии|Навигация|Главная страница"
                      ;;
                    words)
                      npx playwright test --project=bdd --retries=0 \
                        --grep "Управление словами|Управление наборами слов|Фразы$"
                      ;;
                    grammar-kanji)
                      npx playwright test --project=bdd --retries=0 \
                        --grep "Управление грамматикой|Управление кандзи"
                      ;;
                    profile-sync)
                      npx playwright test --project=bdd --retries=0 \
                        --grep "Профиль пользователя|Синхронизация данных|Аутентификация"
                      ;;
                    onboarding-lesson)
                      npx playwright test --project=bdd --retries=0 \
                        --grep "Прохождение онбординга|Оценивание карточек при онбординге|Прохождение урока|Фразы после онбординга"
                      ;;
                  esac

            - name: Upload blob report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: blob-report-${{ matrix.group }}
                  path: end2end/blob-report/
                  retention-days: 7

    e2e-report:
        name: E2E Report
        permissions:
            contents: read
        needs: [e2e]
        if: always() && needs.e2e.result != 'cancelled'
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Node.js dependencies
              working-directory: end2end
              run: npm ci

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-v1-${{ hashFiles('end2end/package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              working-directory: end2end

            - name: Download all blob reports
              uses: actions/download-artifact@v8
              with:
                  pattern: blob-report-*
                  path: end2end/all-blob-reports/

            - name: Flatten blob reports
              working-directory: end2end/all-blob-reports
              run: |
                  count=$(find . -mindepth 2 -type f | wc -l)
                  if [ "$count" -eq 0 ]; then
                    echo "No blob reports found - skipping merge"
                    exit 0
                  fi
                  find . -mindepth 2 -type f | while read -r f; do
                      dir_name=$(basename "$(dirname "$f")")
                      mv "$f" "./${dir_name}_$(basename "$f")"
                  done

            - name: Merge blob reports
              working-directory: end2end
              run: npx playwright merge-reports --reporter=html ./all-blob-reports

            - name: Upload merged Playwright report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-merged
                  path: end2end/playwright-report/
                  retention-days: 30

    build-tauri:
        name: Build Tauri
        needs: [version, e2e-build]
        uses: ./.github/workflows/_build-tauri.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_base: ${{ needs.version.outputs.version_base }}
            version_type: ${{ needs.version.outputs.version_type }}
            commit_sha: ${{ needs.version.outputs.commit_sha }}
            build_date: ${{ needs.version.outputs.build_date }}
            wasm_artifact_name: wasm-dist
            platforms: "windows,linux,android"
            skip_android: ${{ github.actor == 'dependabot[bot]' }}
        secrets:
            tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || vars.TAURI_CI_DUMMY_PRIVATE_KEY }}
            tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
            android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
            android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

    docker-build-landing:
        name: Docker Build (landing)
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build landing image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./origa_landing/Dockerfile
                  push: false
                  cache-from: type=registry,ref=ghcr.io/yurvon-screamo/origa:landing-buildcache
                  build-args: |
                      ORIGA_LANDING_BASE_URL=https://${{ vars.ORIGA_BASE_URI }}
                      ORIGA_APP_BASE_URL=https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}

    docker-build-ui:
        name: Docker Build (ui)
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build UI image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./origa_ui/Dockerfile
                  push: false
                  cache-from: type=registry,ref=ghcr.io/yurvon-screamo/origa:ui-buildcache
                  build-args: |
                      ORIGA_CDN_BASE_URL=https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}
                      ORIGA_CDN_REGION=${{ vars.ORIGA_CDN_REGION }}
                      TRAILBASE_URL=https://${{ vars.ORIGA_APP_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}

    check:
        name: CI Gate
        permissions:
            contents: read
        needs: [lint, test, e2e, e2e-report, docker-build-landing, docker-build-ui, build-tauri, macos-check]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Verify all jobs passed
              run: |
                  check() {
                    local job="$1" result="$2"
                    shift 2
                    for allowed in "$@"; do
                      [[ "$result" == "$allowed" ]] && return 0
                    done
                    echo "::error::$job failed with result: $result"
                    return 1
                  }

                  check "lint" "${{ needs.lint.result }}" "success"
                  check "test" "${{ needs.test.result }}" "success"
                  check "e2e" "${{ needs.e2e.result }}" "success"
                  check "e2e-report" "${{ needs.e2e-report.result }}" "success" "skipped"
                  check "docker-build-landing" "${{ needs.docker-build-landing.result }}" "success"
                  check "docker-build-ui" "${{ needs.docker-build-ui.result }}" "success"
                  check "build-tauri" "${{ needs.build-tauri.result }}" "success"

            - run: echo "All checks passed"
