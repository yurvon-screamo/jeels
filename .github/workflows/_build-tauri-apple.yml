name: Build Tauri Apple Apps

on:
    workflow_call:
        inputs:
            version:
                type: string
                required: true
            # version_base and version_type are retained for caller
            # compatibility (ci.yml and tauri.yml pass them) but are not
            # consumed inside this workflow. Kept as required to avoid a
            # contract-breaking change to the workflow_call signature,
            # mirroring the same pattern in _build-tauri.yml.
            version_base:
                type: string
                required: true
            version_type:
                type: string
                required: true
            commit_sha:
                type: string
                required: true
            build_date:
                type: string
                required: true
            wasm_artifact_name:
                type: string
                required: true
            skip_apple:
                type: boolean
                default: false
        secrets:
            apple-api-issuer:
                required: false
            apple-api-key:
                required: false
            apple-api-key-content:
                required: false
            apple-team-id:
                required: false
            apple-mac-app-cert-p12:
                required: false
            apple-mac-installer-cert-p12:
                required: false
            apple-mac-cert-password:
                required: false
        outputs:
            ios-upload-status:
                description: "iOS App Store Connect upload result: success|failure|skipped"
                value: ${{ jobs.build-ios.outputs.upload-status }}
            macos-build-status:
                description: "macOS .app build result: success|failure|skipped"
                value: ${{ jobs.build-macos.outputs.build-status }}
            macos-upload-status:
                description: "macOS App Store Connect upload result: success|failure|skipped"
                value: ${{ jobs.build-macos.outputs.upload-status }}

env:
    CARGO_TERM_COLOR: always

# Apple builds are gated on:
#   - Not Dependabot (no access to repo secrets)
#   - Not explicitly skipped via `skip_apple` input
# This keeps macOS runner minutes free for tag-driven releases and
# manual workflow_dispatch runs, where the Apple secrets are available.

jobs:
    build-ios:
        name: Build iOS
        if: github.actor != 'dependabot[bot]' && inputs.skip_apple != true
        runs-on: macos-15
        permissions:
            contents: read
        outputs:
            upload-status: ${{ steps.upload-report.outputs.status }}
        env:
            ORIGA_VERSION: ${{ inputs.version }}
            ORIGA_COMMIT: ${{ inputs.commit_sha }}
            ORIGA_BUILD_DATE: ${{ inputs.build_date }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Select latest Xcode with iOS 26 SDK
              shell: bash
              run: |
                  # deploymentTarget.iOS: 26.0 requires Xcode 26 with iOS 26 SDK.
                  # GitHub macos-15 runner ships multiple Xcode versions; pick the
                  # newest one and verify it has iphoneos26 SDK before continuing.
                  LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
                  if [ -z "$LATEST_XCODE" ]; then
                    echo "::error::No Xcode found in /Applications"
                    exit 1
                  fi
                  echo "Selected Xcode: $LATEST_XCODE"
                  sudo xcode-select -s "$LATEST_XCODE"
                  if ! xcodebuild -showsdks | grep -q "iphoneos26"; then
                    echo "::error::iOS 26 SDK not found in $LATEST_XCODE"
                    echo "--- Available SDKs ---"
                    xcodebuild -showsdks
                    exit 1
                  fi
                  echo "iOS 26 SDK verified"

            - name: Download WASM artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ inputs.wasm_artifact_name }}
                  path: origa_ui/dist/

            - name: Decode Apple API Key
              env:
                  APPLE_API_KEY_CONTENT: ${{ secrets.apple-api-key-content }}
                  APPLE_API_KEY: ${{ secrets.apple-api-key }}
              run: |
                  # Two consumers need the .p8 file:
                  # 1. Tauri iOS build (cargo-mobile2 → xcodebuild auto-provisioning)
                  #    reads it via APPLE_API_KEY_PATH env var (any path).
                  # 2. `xcrun altool --upload-app` (App Store Connect upload)
                  #    searches for `AuthKey_<key>.p8` ONLY in these dirs:
                  #    ./private_keys/, ~/private_keys/, ~/.private_keys/,
                  #    ~/.appstoreconnect/private_keys/, or $API_PRIVATE_KEYS_DIR.
                  #    altool does NOT honor APPLE_API_KEY_PATH.
                  # Solution: write the .p8 to ./private_keys/ so both consumers
                  #    can find it, and set APPLE_API_KEY_PATH to the same file
                  #    for cargo-mobile2.
                  #
                  # The APPLE_API_KEY_CONTENT secret may hold either:
                  # (a) base64-encoded .p8 contents (from `base64 -i AuthKey.p8`
                  #     or `[Convert]::ToBase64String(...)` in PowerShell)
                  # (b) raw PEM contents pasted directly into the secret field.
                  # Detect at runtime by checking whether the value starts with
                  # the PEM header. Both paths strip ALL whitespace to avoid
                  # xcodebuild `CryptoKitASN1Error.invalidPEMDocument` errors
                  # caused by CRLF/CR/LF pollution from web UI paste.
                  KEY_PATH="private_keys/AuthKey_${APPLE_API_KEY}.p8"
                  mkdir -p private_keys

                  # Normalize: strip ALL whitespace; this collapses both the
                  # base64 case (newlines folded in web UI) and the raw-PEM
                  # case (CRLF line endings) into a single contiguous string
                  # for the format test below.
                  NORMALIZED=$(printf '%s' "$APPLE_API_KEY_CONTENT" | tr -d '[:space:]')

                  if [[ "$NORMALIZED" == -----BEGINPRIVATEKEY* ]]; then
                      # Raw PEM pasted directly. Re-wrap at 64 chars per line
                      # with proper PEM headers (PKCS#8 format Apple uses).
                      INNER=$(printf '%s' "$NORMALIZED" \
                              | sed 's/^-----BEGINPRIVATEKEY-----//' \
                              | sed 's/-----ENDPRIVATEKEY-----$//')
                      {
                          echo "-----BEGIN PRIVATE KEY-----"
                          printf '%s' "$INNER" | fold -w 64
                          echo ""
                          echo "-----END PRIVATE KEY-----"
                      } > "$KEY_PATH"
                  else
                      # base64-encoded .p8 file. Decode to original PEM.
                      printf '%s' "$NORMALIZED" | base64 --decode > "$KEY_PATH"
                  fi

                  echo "APPLE_API_KEY_PATH=$(pwd)/$KEY_PATH" >> "$GITHUB_ENV"

                  # Sanity check: file must contain PEM markers and be ~200-250 bytes.
                  if [ ! -s "$KEY_PATH" ]; then
                    echo "::error::Decoded .p8 is empty — secret malformed"
                    exit 1
                  fi
                  file_size=$(wc -c < "$KEY_PATH")
                  echo "Decoded .p8 size: $file_size bytes"
                  if [ "$file_size" -lt 200 ]; then
                    echo "::error::Decoded .p8 is suspiciously small ($file_size bytes) — secret may be truncated"
                    exit 1
                  fi
                  # Show the PEM header line (safe — not sensitive).
                  echo "PEM header: $(head -1 "$KEY_PATH")"

                  # Validate the key parses as a real EC private key. Catches
                  # truncation/corruption that produces a valid-looking PEM
                  # envelope but an invalid ASN.1 key body inside. Without
                  # this check, xcodebuild fails ~10 min later with
                  # `CryptoKitASN1Error.invalidPEMDocument` after cargo build.
                  if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
                    echo "::error::Decoded .p8 is not a valid private key (openssl pkey parse failed)."
                    echo "The APPLE_API_KEY_CONTENT secret is likely corrupted or truncated."
                    echo "Re-download the original .p8 from App Store Connect → Users and Access → Keys"
                    echo "(the file can only be downloaded ONCE at key creation time)."
                    echo "If you no longer have the .p8: revoke the key, create a new one, store"
                    echo "its base64 via:  base64 -i AuthKey_<key>.p8 | tr -d '\\n'"
                    echo "...then update the APPLE_API_KEY, APPLE_API_KEY_CONTENT, and APPLE_API_ISSUER secrets."
                    exit 1
                  fi
                  echo "✅ PEM key validated (openssl parsed it successfully)"
                  echo "API key decoded to $KEY_PATH"

            - name: Update version in config files
              uses: ./.github/actions/update-version
              with:
                  version: ${{ inputs.version }}

            - name: Setup Rust with caching
              uses: ./.github/actions/setup-rust
              with:
                  targets: aarch64-apple-ios
                  shared-key: origa-ios-v1
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Setup frontend tools
              uses: ./.github/actions/setup-frontend
              with:
                  tools: tauri-cli

            - name: Build iOS .ipa (App Store export)
              working-directory: tauri
              env:
                  APPLE_API_ISSUER: ${{ secrets.apple-api-issuer }}
                  APPLE_API_KEY: ${{ secrets.apple-api-key }}
                  APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
                  APPLE_TEAM_ID: ${{ secrets.apple-team-id }}
                  # ORIGA_APP_STORE signals tauri/build.rs to emit the
                  # `app_store` rustc cfg, which gates out updater /
                  # single-instance / release-devtools for Mac App Store
                  # compliance (2.4.5(vii), 2.5.1). Env-var path is used
                  # because `cargo tauri ios build` does NOT propagate
                  # `--no-default-features --features` to cargo.
                  ORIGA_APP_STORE: "1"
              run: |
                  # Pass APPLE_TEAM_ID via tauri.conf.json `bundle.iOS.developmentTeam`
                  # through the --config merge patch. Without this, xcodebuild
                  # fails with "No Account for Team" / "No profiles for
                  # 'net.uwuwu.origa' were found" because tauri-cli's
                  # auto-provisioning needs to know which team owns the bundle ID.
                  # The APPLE_TEAM_ID env var alone is NOT picked up by tauri-cli
                  # for iOS team assignment — it must be in the config.
                  APP_STORE_CONFIG="{\"bundle\":{\"iOS\":{\"developmentTeam\":\"$APPLE_TEAM_ID\"}}}"
                  cargo tauri ios build \
                    --export-method app-store-connect \
                    --config "$APP_STORE_CONFIG"

            - name: Locate .ipa
              id: ipa
              shell: bash
              run: |
                  # tauri-cli may place the .ipa under target/ OR under
                  # tauri/gen/apple/build/ depending on the export-method
                  # and tauri-cli version. Search both trees.
                  IPA_PATH=$(find target tauri/gen/apple -name "*.ipa" -type f 2>/dev/null | head -1)
                  if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
                    echo "::error::No .ipa produced by cargo tauri ios build"
                    echo "--- Searching entire repo for *.ipa ---"
                    find . -name "*.ipa" -type f 2>/dev/null | grep -v node_modules || true
                    exit 1
                  fi
                  echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
                  ls -la "$IPA_PATH"

            - name: Upload .ipa artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ios-build
                  path: ${{ steps.ipa.outputs.path }}
                  retention-days: 7

            - name: Upload to App Store Connect
              id: upload
              continue-on-error: true
              env:
                  APPLE_API_ISSUER: ${{ secrets.apple-api-issuer }}
                  APPLE_API_KEY: ${{ secrets.apple-api-key }}
              run: |
                  # xcrun altool handles App Store Connect upload using the same
                  # API key as signing. continue-on-error: true so a failed
                  # upload does not block the workflow — the .ipa is preserved
                  # as artifact for manual upload via Transporter.app.
                  xcrun altool --upload-app --type ios \
                    --file "${{ steps.ipa.outputs.path }}" \
                    --apiKey "$APPLE_API_KEY" \
                    --apiIssuer "$APPLE_API_ISSUER"

            - name: Report upload result
              id: upload-report
              if: always()
              shell: bash
              run: |
                  if [ "${{ steps.upload.outcome }}" = "success" ]; then
                    echo "status=success" >> "$GITHUB_OUTPUT"
                    echo "✅ iOS build uploaded to App Store Connect"
                  else
                    echo "status=failure" >> "$GITHUB_OUTPUT"
                    echo "::warning::xcrun altool upload failed. Download the ios-build artifact and upload manually via Transporter.app (https://apps.apple.com/us/app/transporter/id1450874784)"
                  fi

            - name: Cleanup API key
              if: always()
              shell: bash
              run: |
                  rm -rf private_keys
                  echo "API key cleaned up"

    build-macos:
        name: Build macOS (Universal Binary)
        if: github.actor != 'dependabot[bot]' && inputs.skip_apple != true
        runs-on: macos-15
        permissions:
            contents: read
        outputs:
            build-status: ${{ steps.build-report.outputs.status }}
            upload-status: ${{ steps.upload-report.outputs.status }}
        env:
            ORIGA_VERSION: ${{ inputs.version }}
            ORIGA_COMMIT: ${{ inputs.commit_sha }}
            ORIGA_BUILD_DATE: ${{ inputs.build_date }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Select latest Xcode
              shell: bash
              run: |
                  LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
                  if [ -z "$LATEST_XCODE" ]; then
                    echo "::error::No Xcode found in /Applications"
                    exit 1
                  fi
                  echo "Selected Xcode: $LATEST_XCODE"
                  sudo xcode-select -s "$LATEST_XCODE"

            - name: Download WASM artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ inputs.wasm_artifact_name }}
                  path: origa_ui/dist/

            - name: Import Mac App signing certificate
              uses: apple-actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.apple-mac-app-cert-p12 }}
                  p12-password: ${{ secrets.apple-mac-cert-password }}
                  keychain: build

            - name: Import Mac Installer signing certificate
              uses: apple-actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.apple-mac-installer-cert-p12 }}
                  p12-password: ${{ secrets.apple-mac-cert-password }}
                  keychain: build

            - name: Discover signing identities
              env:
                  APPLE_MAC_CERT_PASSWORD: ${{ secrets.apple-mac-cert-password }}
              run: |
                  # apple-actions/import-codesign-certs creates 'build.keychain',
                  # imports both certs, sets no-auto-lock, configures partition
                  # list, and makes it default. This is the battle-tested path
                  # recommended by tauri-apps/tauri-action#941 — manual
                  # `security import` + `set-key-partition-list` scripts
                  # consistently fail on headless runners because productbuild
                  # blocks waiting for a GUI passphrase prompt that never
                  # appears.

                  # App identity for tauri-bundler (codesign)
                  APP_IDENTITY=$(security find-identity -v -p codesigning | grep -E "Mac App Distribution|3rd Party Mac Developer Application" | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
                  if [ -z "$APP_IDENTITY" ]; then
                    echo "::error::Mac App Distribution / 3rd Party Mac Developer Application identity not found"
                    security find-identity -v -p codesigning
                    exit 1
                  fi
                  echo "APPLE_SIGNING_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
                  echo "Signing identity: $APP_IDENTITY"

            - name: Decode Apple API Key
              env:
                  APPLE_API_KEY_CONTENT: ${{ secrets.apple-api-key-content }}
                  APPLE_API_KEY: ${{ secrets.apple-api-key }}
              run: |
                  # Same pattern as build-ios: write to ./private_keys/ so
                  # xcrun altool finds the key (it searches ./private_keys/,
                  # ~/private_keys/, ~/.private_keys/, ~/.appstoreconnect/
                  # private_keys/, or $API_PRIVATE_KEYS_DIR — NOT /tmp/).
                  # APPLE_API_KEY_PATH is unused by macOS build (codesign uses
                  # keychain identity, not API key), but set for consistency.
                  KEY_PATH="private_keys/AuthKey_${APPLE_API_KEY}.p8"
                  mkdir -p private_keys
                  echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
                  echo "APPLE_API_KEY_PATH=$(pwd)/$KEY_PATH" >> "$GITHUB_ENV"
                  echo "API key decoded to $KEY_PATH"

            - name: Update version in config files
              uses: ./.github/actions/update-version
              with:
                  version: ${{ inputs.version }}

            - name: Setup Rust with caching
              uses: ./.github/actions/setup-rust
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin
                  shared-key: origa-macos-v1
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Setup frontend tools
              uses: ./.github/actions/setup-frontend
              with:
                  tools: tauri-cli

            - name: Build macOS Universal Binary (.app)
              id: build
              working-directory: tauri
              env:
                  APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
                  # See build-ios job for rationale on ORIGA_APP_STORE.
                  ORIGA_APP_STORE: "1"
              run: |
                  # Universal Binary requires both arm64 and x86_64 targets;
                  # tauri-bundler combines them via lipo automatically when
                  # --target universal-apple-darwin is used.
                  # --bundles app produces a signed .app (no .dmg), sufficient
                  # for productbuild .pkg generation in the next step.
                  #
                  # --config applies an RFC 7396 JSON Merge Patch that tauri-cli
                  # natively merges onto tauri.conf.json. The build.rs
                  # TAURI_CONFIG env var mechanism is NOT visible to tauri-cli
                  # (it re-reads tauri.conf.json directly), so we have to pass
                  # the patch via --config. The patch:
                  #   - bundle.createUpdaterArtifacts: false (no .sig files)
                  #   - plugins.updater: null (RFC 7396 delete — without this
                  #     tauri-bundler fails "public key found, but no private
                  #     key" because the bundler sees `plugins.updater.pubkey`
                  #     in tauri.conf.json and expects TAURI_SIGNING_PRIVATE_KEY).
                  APP_STORE_CONFIG='{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":null}}'
                  cargo tauri build \
                    --target universal-apple-darwin \
                    --bundles app \
                    --config "$APP_STORE_CONFIG"

            - name: Verify Universal Binary
              run: |
                  APP_PATH=$(find target/universal-apple-darwin/release/bundle/macos -name "*.app" -type d | head -1)
                  if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
                    echo "::error::No .app found under bundle/macos/"
                    find target/universal-apple-darwin/release/bundle -type d 2>/dev/null || true
                    exit 1
                  fi
                  echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

                  BIN_PATH="$APP_PATH/Contents/MacOS/origa"
                  if [ ! -f "$BIN_PATH" ]; then
                    # Try alternative binary names ( productName lowercase )
                    BIN_PATH=$(find "$APP_PATH/Contents/MacOS" -type f | head -1)
                  fi
                  echo "Binary: $BIN_PATH"
                  lipo -info "$BIN_PATH"
                  if ! lipo -info "$BIN_PATH" | grep -q "arm64.*x86_64\|x86_64.*arm64"; then
                    echo "::error::Binary is not Universal (arm64 + x86_64)"
                    exit 1
                  fi
                  echo "✅ Universal Binary verified"

            - name: Verify entitlements
              run: |
                  codesign -d --entitlements - "$APP_PATH" 2>&1 | tee /tmp/entitlements.txt
                  for KEY in com.apple.security.app-sandbox \
                             com.apple.security.network.client \
                             com.apple.security.device.camera \
                             com.apple.security.device.microphone \
                             com.apple.security.files.user-selected.read-write; do
                    if ! grep -q "$KEY" /tmp/entitlements.txt; then
                      echo "::error::Missing entitlement: $KEY"
                      exit 1
                    fi
                  done
                  echo "✅ All 5 entitlements present"
                  rm -f /tmp/entitlements.txt

            - name: Build .pkg via productbuild
              id: pkg
              timeout-minutes: 10
              env:
                  APPLE_MAC_CERT_PASSWORD: ${{ secrets.apple-mac-cert-password }}
              run: |
                  # productbuild signs the .pkg with Mac Installer
                  # Distribution cert (separate from Application cert).
                  # Match both old (pre-Xcode 11) and new CN naming.
                  #
                  # NOTE: Installer cert lookup uses `-p basic` (not
                  # `-p codesigning`). Mac Installer Distribution is not
                  # classified as a "codesigning" identity by Security
                  # framework — `find-identity -p codesigning` returns
                  # only Application certs. `productbuild` itself accepts
                  # any identity visible in the keychain.
                  #
                  # productbuild can hang silently if the keychain blocks
                  # private-key access (no GUI to prompt for passphrase on
                  # headless runner). `set-key-partition-list` in the import
                  # step should whitelist `apple-tool:` and `apple:`, but
                  # if productbuild is the first tool to actually exercise
                  # the installer identity's private key, the partition may
                  # not cover it. timeout-minutes: 10 prevents the previous
                  # >1h hang; the .app artifact remains valid for manual
                  # packaging if this step times out.
                  # Use SHA-1 hash instead of CN — productbuild resolves
                  # identity by hash more reliably than by CN string match
                  # (CN matching can require keychain UI prompt on some
                  # macOS versions even when partition list is correct).
                  # Output of `find-identity -v -p basic` is:
                  #   1) HASH "CN string" (TEAM)
                  #   2) HASH "CN string" (TEAM)
                  # $1 = "N)" prefix, $2 = SHA-1 hash.
                  INSTALLER_LINE=$(security find-identity -v -p basic | grep -E "Mac Installer Distribution|3rd Party Mac Developer Installer" | head -1 || true)
                  if [ -z "$INSTALLER_LINE" ]; then
                    echo "::error::Mac Installer Distribution / 3rd Party Mac Developer Installer identity not found"
                    security find-identity -v -p basic
                    exit 1
                  fi
                  INSTALLER_IDENTITY=$(echo "$INSTALLER_LINE" | awk '{print $2}')
                  echo "Installer identity (SHA-1): $INSTALLER_IDENTITY"
                  echo "  from line: $INSTALLER_LINE"

                  # Re-unlock and re-confirm no auto-lock right before
                  # productbuild — paranoia layer in case something
                  # between the import step and here re-locked or
                  # changed settings.
                  security unlock-keychain -p "$APPLE_MAC_CERT_PASSWORD" build.keychain
                  security set-keychain-settings build.keychain
                  security default-keychain -s build.keychain
                  echo "Keychain state before productbuild:"
                  security show-keychain-info build.keychain || true

                  PKG_PATH="$RUNNER_TEMP/Origa.pkg"
                  productbuild --component "$APP_PATH" /Applications \
                    --sign "$INSTALLER_IDENTITY" \
                    "$PKG_PATH"
                  echo "path=$PKG_PATH" >> "$GITHUB_OUTPUT"
                  ls -la "$PKG_PATH"

            - name: Upload .pkg artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-pkg-build
                  path: ${{ steps.pkg.outputs.path }}
                  retention-days: 7

            - name: Upload to App Store Connect
              id: upload
              continue-on-error: true
              timeout-minutes: 15
              env:
                  APPLE_API_ISSUER: ${{ secrets.apple-api-issuer }}
                  APPLE_API_KEY: ${{ secrets.apple-api-key }}
              run: |
                  xcrun altool --upload-app --type mac \
                    --file "${{ steps.pkg.outputs.path }}" \
                    --apiKey "$APPLE_API_KEY" \
                    --apiIssuer "$APPLE_API_ISSUER"

            - name: Report build result
              id: build-report
              if: always()
              shell: bash
              run: |
                  if [ "${{ steps.build.outcome }}" = "success" ]; then
                    echo "status=success" >> "$GITHUB_OUTPUT"
                  else
                    echo "status=failure" >> "$GITHUB_OUTPUT"
                  fi

            - name: Report upload result
              id: upload-report
              if: always()
              shell: bash
              run: |
                  if [ "${{ steps.upload.outcome }}" = "success" ]; then
                    echo "status=success" >> "$GITHUB_OUTPUT"
                    echo "✅ macOS build uploaded to App Store Connect"
                  else
                    echo "status=failure" >> "$GITHUB_OUTPUT"
                    echo "::warning::xcrun altool upload failed. Download the macos-pkg-build artifact and upload manually via Transporter.app"
                  fi

            - name: Cleanup API key and keychain
              if: always()
              shell: bash
              run: |
                  rm -rf private_keys
                  # Delete build.keychain to avoid leaking identity across jobs
                  security delete-keychain build.keychain 2>/dev/null || true
                  echo "Cleanup complete"
