name: Temp Update Security Lock

on:
  push:
    branches:
      - chore/security-deps-bump

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update security dependencies in Cargo.lock
        run: |
          set -euo pipefail
          # tauri: pinned to the known-good dependabot-tested version closing
          # alert #19 (CVE-2026-42184 origin confusion, fixed in 2.11.1)
          cargo update -p tauri --precise 2.11.1
          # quinn-proto: latest 0.11.x, closes alert #30 (memory exhaustion,
          # fixed in 0.11.15)
          cargo update -p quinn-proto
          # serde_with: latest 3.x, closes alert #25 (KeyValueMap panic,
          # fixed in 3.21.0)
          cargo update -p serde_with

      - name: Show resulting versions
        run: |
          grep -A1 -E '^name = "(tauri|quinn-proto|serde_with)"$' Cargo.lock

      - name: Commit and push Cargo.lock
        run: |
          git config user.name "origa-ci-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet Cargo.lock; then
            echo "::warning::Cargo.lock unchanged — nothing to commit"
            exit 0
          fi
          git add Cargo.lock
          git commit -m "fix(deps): bump tauri 2.11.1, quinn-proto, serde_with in Cargo.lock"
          git push origin HEAD:chore/security-deps-bump

      - name: Remove this temporary workflow
        run: |
          git config user.name "origa-ci-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm .github/workflows/tmp-update-security-lock.yml
          git commit -m "chore: remove temporary lock-update workflow"
          git push origin HEAD:chore/security-deps-bump
