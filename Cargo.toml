[workspace]
members = ["origa", "utils", "origa_ui", "tauri", "origa_landing", "tauri-plugin-aswebauth"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["yurvon-screamo <yurvon@ya.ru>"]
license-file = "LICENSE"
repository = "https://github.com/yurvon-screamo/origa"
readme = "README.md"

[workspace.dependencies]
# System
tokio = { version = "1.48", default-features = false, features = [
    "rt",
    "macros",
    "time",
] }
base64 = "0.22"
tempfile = "3.25"
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
clap = { version = "4.5", features = ["derive", "env"] }
gloo-timers = "0.3"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-wasm = "0.2"
tracing-subscriber = "0.3"

# Crash reporting — rustls-only (no native-tls/openssl), reuses the ring
# crypto provider that tauri installs in `run()`. See ADR-036 for the
# rationale behind `default-features = false` (avoids the `transport`
# feature pulling in `native-tls` and breaking the Android build).
sentry = { version = "0.49", default-features = false, features = [
    "rustls-no-provider",
    "panic",
    "backtrace",
    "contexts",
    "release-health",
    "reqwest",
    "debug-images",
    "tracing",
    "logs",
] }

# Domain
ulid = { version = "1.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["std", "clock", "serde", "wasmbind"] }
rand = "0.9"
rusqlite = { version = "0.39", default-features = false }
thiserror = "2.0"
sha2 = "0.10"
hmac = "0.12"

# Japan
rs-fsrs = "1.2"
lindera = { version = "2.2", default-features = false }
lindera-dictionary = { version = "2.2" }
flate2 = "1.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
image = "0.25"

# OCR / Machine Learning
ndarray = "0.17"
hound = "3.5"
rustfft = "6.2"
ort = { version = "2.0.0-rc.12", default-features = false }
ort-web = "0.2.1"
as-slice = "0.2"
getrandom = "0.3"

# Origa workspace crates
origa = { path = "./origa" }
utils = { path = "./utils" }

# Utility
idb = "0.6"
lexical-sort = "0.3"

# Testing
rstest = "0.26"

# UI
leptos = { version = "0.8", default-features = false, features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = "0.8"
leptos_icons = "0.7"
icondata = "0.7"
leptos-use = { version = "0.18" }
leptos_i18n = { version = "0.6", default-features = false, features = ["csr", "plurals", "cookie"] }
leptos_i18n_build = { version = "0.6", default-features = false, features = ["csr", "plurals"] }
pulldown-cmark = "0.12"
ammonia = "4"
scraper = "0.22"
ego-tree = "0.10"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "util"] }
http = "1"
http-body-util = "0.1"
js-sys = "0.3"
codee = { version = "0.3", features = ["json_serde"] }
console_error_panic_hook = "0.1"
gloo-storage = "0.3"
gloo-net = { version = "0.6", default-features = false, features = [
    "http",
    "json",
] }
urlencoding = "2.1"
url = "2.5"

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-tts = "0.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-haptics = "2"
tauri-plugin-aswebauth = { path = "tauri-plugin-aswebauth" }
tauri-build = { version = "2", features = [] }
tauri-plugin = { version = "2", features = ["build"] }
# device-ai: native AI APIs (ASR/OCR/TTS). Pinned to a fork rev that fixes the
# upstream mobile bridge (hypothesi's CI never built mobile, so two compile
# errors went unnoticed: missing get_capabilities on the mobile impl, and
# `?` on register_*_plugin without From<PluginInvokeError>).
# Scoped to macOS/iOS/Android:
#  - Windows: upstream windows.rs does not compile against windows 0.58
#    (WinRT API drift) and Windows TTS "synthesizes but does not play".
#  - Linux: device-ai has no Linux backend (returns FeatureNotAvailable).
# Windows + Linux keep their current stack — strictly non-regressing.
# Future: upstream the mobile fix and switch back to hypothesi/...
tauri-plugin-device-ai-apis = { git = "https://github.com/yurvon-screamo/tauri-plugin-device-ai-apis", rev = "90805969cebc4e5320bf662db1cfc9f63d4fb6fb" }
device-ai = { git = "https://github.com/yurvon-screamo/tauri-plugin-device-ai-apis", rev = "90805969cebc4e5320bf662db1cfc9f63d4fb6fb" }

# Dev Dependencies
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = { version = "0.4", features = [
    "futures-core-03-stream",
] }
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope",
    "DomException",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemHandlePermissionDescriptor",
    "FileSystemReadWriteOptions",
    "FileSystemRemoveOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemWritableFileStream",
    "Navigator",
    "StorageManager",
    "WorkerNavigator",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlMediaElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Window",
    "Node",
    "Element",
    "Event",
    "EventTarget",
    "InputEvent",
    "Geolocation",
    "GeolocationPosition",
    "GeolocationPositionError",
    "PositionOptions",
    "console",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
    "Cache",
    "CacheStorage",
    "Response",
    "ResponseInit",
    "Url",
    "Performance",
] }


[profile.release]
opt-level = 'z'
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = "fat"
codegen-units = 1
panic = "abort"

# Android dev: debug WASM balloons to ~300 MB and crashes the WebView heap
# (OutOfMemoryError in RustWebViewClient.shouldInterceptRequest — see
# tauri-apps/tauri#13554). This profile strips debug symbols and applies a
# light opt-level so the resulting .wasm fits the ~192 MB Android heap while
# still compiling fast enough for hot reload. Use via
# `TRUNK_BUILD_CARGO_PROFILE=wasm-dev cargo tauri android dev`.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = true
codegen-units = 16
